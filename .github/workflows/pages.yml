name: site

# Builds the prerendered site and publishes web/dist to GitHub Pages.
# The site expects to be served from a domain root: web/vite.config.js keeps
# Vite's default base of "/", so a project page (user.github.io/repo/) needs
# `base` set to the repo path, or a custom domain pointed at Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The generated artifacts are committed; refuse to publish stale ones.
      - run: python3 build.py --check
      - run: python3 build_site.py --check
      # The pack manifest is conformant (packstruct SPEC v1) before anything
      # tries to arm it: lint the shape at author time, not at audit time.
      - run: npx --yes packstruct@1.1.2 lint packs/ --deep
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Audit what shipped, not what we meant to ship: head/site/links/i18n/
      # a11y/language, plus our own shape pack. Both are pinned - an audit is a
      # gate, so it must not move under us on an unpinned release.
      - run: npx --yes poststruct@1.2.0 audit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

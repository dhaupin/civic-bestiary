# Generated from schema/record.json by build_schema.py - edit the schema, not this file.
name: "New entry"
description: "Propose a term for the Civic Bestiary"
title: "[New entry] "
labels: ["new-term"]
body:
  - type: markdown
    attributes:
      value: "Thanks for proposing a term. Pick the kind of thing you are naming first - a species is an actor you can point at, a move is an action you can watch, an ability is a capability an institution wields, a habitat is the place that houses them, a buff is a temporary condition, a fallacy is a documented argument, and a remedy or a keystone is a thing that answers one. Then fill in what you can; the maintainers handle placement, cross-references, and the final edit."
  - type: input
    id: term
    attributes:
      label: "Term"
      description: "The coinage, spelled the way it should be listed. Title case, no quotes."
      placeholder: "<Term> - one word, title case, no quotes"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      description: "What sort of thing this is. A species is a person-shaped pattern, a move is an action, an ability belongs to an office, a habitat is a place that houses them, a buff is a condition, a fallacy is a documented error in reasoning, a remedy is a procedure that answers one, and a keystone is the office whose absence is the problem."
      options:
        - "Species"
        - "Move"
        - "Ability"
        - "Habitat"
        - "Buff"
        - "Fallacy"
        - "Remedy"
        - "Keystone"
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: "Chapter"
      description: "Which chapter the entry belongs to. The maintainers will move it if it belongs elsewhere."
      options:
        - "I. Performative Identity & Weaponized Liberty"
        - "II. Bad-Faith Debate & Epistemic Breakdown"
        - "III. Hypocrisy, Revisionism & Authoritarian Submission"
        - "IV. Fearmongering, Grift & Algorithmic Radicalization"
        - "V. Normalization, Numbness & the Noise Floor"
        - "VI. The Keystones"
    validations:
      required: true
  - type: dropdown
    id: part_of_speech
    attributes:
      label: "Part of speech"
      description: "What the term is grammatically. Most species are nouns; moves are usually gerunds."
      options:
        - "noun"
        - "adjective"
        - "verb"
        - "adverb"
        - "verb phrase / gerund"
    validations:
      required: true
  - type: input
    id: ipa
    attributes:
      label: "Pronunciation"
      description: "IPA between slashes. Approximate is fine."
      placeholder: "/<term>/ - approximate is fine"
    validations:
      required: true
  - type: input
    id: etymology
    attributes:
      label: "Etymology"
      description: "Where the word came from, in one line. Name both parents if it is a blend."
      placeholder: "<parent> + <parent> - name both halves if it is a blend"
    validations:
      required: true
  - type: textarea
    id: senses
    attributes:
      label: "Senses"
      description: "Two definitions: the thing itself, then the pattern it runs. Full sentences, one per line. The first sense becomes the page description, so make it stand alone."
      placeholder: "1. <what it is, in one sentence> 2. <why it works, in one sentence>"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: "Example"
      description: "One sentence in the wild, with the term in bold. Wrap the quotation in *asterisks*; the README renders it as an aside."
      placeholder: "*\"<a line you could overhear>\"* - the term in **bold**"
    validations:
      required: true
  - type: textarea
    id: confused_with
    attributes:
      label: "Easily confused with"
      description: "Existing terms it could be mistaken for, and the one thing that tells them apart. Optional at proposal time - the maintainers add twins when the confusion is real."
      placeholder: "<Nearest neighbour> - the one thing that tells them apart"
  - type: textarea
    id: identification
    attributes:
      label: "The identification block"
      description: "Describe it the way its kind is described. Species: occasion, call, tell, counter. Move: trigger, tell, counter. Ability: effect, available to, counter. Habitat: carriers, economics, signature. Buff: effect, tell, expires. Fallacy: family, committed when, the tell, counter. Remedy: effect, costs, failure, tell. Keystone: office, call, tell, keystone."
      placeholder: "Occasion: ... Call: ... Tell: ... Counter: ..."
  - type: markdown
    attributes:
      value: "A proposal lands as a record under `data/entries/<kind>/` once the writing holds up. The bar is not novelty, it is use: the term should name something a reader recognises and has no word for yet."

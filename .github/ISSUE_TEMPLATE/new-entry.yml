# Generated from schema/record.json by build_schema.py - edit the schema, not this file.
name: "New entry"
description: "Propose a term for the Civic Bestiary"
title: "[New entry] "
labels: ["new-term"]
body:
  - type: markdown
    attributes:
      value: "Thanks for proposing a term. Pick the kind of thing you are naming first - a species is an actor you can point at, a move is an action you can watch, an ability is a capability an institution wields, a format is a medium that stages the others, and a buff is a temporary condition. Then fill in what you can; the maintainers handle placement, cross-references, and the final edit."
  - type: input
    id: term
    attributes:
      label: "Term"
      description: "The coinage, spelled the way it should be listed. Title case, no quotes."
      placeholder: "Playtriot"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      description: "What sort of thing this is. A species is a person-shaped pattern, a move is an action, an ability belongs to an office, a format is a show, and a buff is a condition."
      options:
        - "Species"
        - "Move"
        - "Ability"
        - "Format"
        - "Buff"
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: "Chapter"
      description: "Which chapter the entry belongs to. The maintainers will move it if it belongs elsewhere."
      options:
        - "I. Performative Identity & Weaponized Liberty"
        - "II. Bad-Faith Debate & Epistemic Breakdown"
        - "III. Hypocrisy, Revisionism & Authoritarian Submission"
        - "IV. Fearmongering, Grift & Algorithmic Radicalization"
    validations:
      required: true
  - type: dropdown
    id: part_of_speech
    attributes:
      label: "Part of speech"
      description: "What the term is grammatically. Most species are nouns; moves are usually gerunds."
      options:
        - "noun"
        - "adjective"
        - "verb"
        - "adverb"
        - "verb phrase / gerund"
    validations:
      required: true
  - type: input
    id: ipa
    attributes:
      label: "Pronunciation"
      description: "IPA between slashes. Approximate is fine."
      placeholder: "/ˈpleɪ.tri.ət/"
    validations:
      required: true
  - type: input
    id: etymology
    attributes:
      label: "Etymology"
      description: "Where the word came from, in one line. Name both parents if it is a blend."
      placeholder: "Blend of \"play\" + \"patriot\""
    validations:
      required: true
  - type: textarea
    id: senses
    attributes:
      label: "Senses"
      description: "Two definitions: the thing itself, then the pattern it runs. Full sentences, one per line. The first sense becomes the page description, so make it stand alone."
      placeholder: "A citizen who performs patriotism as a shield while undermining the civic obligations it claims to honour."
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: "Example"
      description: "One sentence in the wild, with the term in bold. Wrap the quotation in *asterisks*; the README renders it as an aside."
      placeholder: "*\"He wrapped himself in the flag at every rally, yet his refusal to respect basic civic responsibilities showed he was more of a **playtriot** than a true patriot.\"*"
    validations:
      required: true
  - type: textarea
    id: confused_with
    attributes:
      label: "Easily confused with"
      description: "Existing terms it could be mistaken for, and the one thing that tells them apart. Optional at proposal time - the maintainers add twins when the confusion is real."
      placeholder: "LARPtarian - both dress the part; the playtriot buys the flag, the LARPtarian buys the surplus rifle."
  - type: textarea
    id: identification
    attributes:
      label: "The identification block"
      description: "Describe it the way its kind is described. Species: range, call, field marks. Move: trigger, tell, counter. Ability: effect, available to, counter. Format: carriers, economics, signature. Buff: effect, tell, expires."
      placeholder: "Range: ... Call: ... Field marks: ..."
  - type: markdown
    attributes:
      value: "A proposal lands as a record under `data/entries/` once the writing holds up. The bar is not novelty, it is use: the term should name something a reader recognises and has no word for yet."

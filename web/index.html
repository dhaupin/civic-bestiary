<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Shell template. Do not add brand meta here directly: prestruct's
    inject-brand pass populates the title, description, canonical, Open Graph,
    Twitter Card, and JSON-LD at build time from web/ssr.config.js. The
    placeholders below give the inject regex something to match and are
    replaced before deploy - never served as-is.
  -->
  <title>Your Site</title>
  <meta name="description" content="" />
  <meta name="keywords"    content="" />
  <meta name="author"      content="" />
  <meta name="robots"      content="index, follow, max-image-preview:large" />
  <link rel="canonical"    href="https://codex.creadev.org" />
  <meta name="theme-color" content="#f4efe6" />

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="alternate" type="application/atom+xml" title="The Civic Bestiary - latest" href="/latest.xml" />

  <!-- Type is self-hosted (src/fonts.css): the Google stylesheet was the largest
       render-blocking request on the page. The three faces used above the fold
       are preloaded so the first paint already has them - a font that arrives
       after paint moves every line below it, which is the page's whole CLS. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxC9TeP2Xz5c.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cY9AfjOCX1hbuyalUrK4397yjIJFJpc.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/-F63fjptAgt5VM-kVkqdyU8n1i8q131nj-o.woff2" />

  <script>
    // Theme bootstrap: apply a persisted dark theme before first paint so the
    // page never flashes the wrong palette. Keys and paper values are shared
    // with src/theme.js and ThemeSwitch.jsx - keep all three in sync.
    try {
      // No stored choice means the reader has not chosen: follow the OS. A site
      // that ignores a dark desktop is a site that flashes white at 2am.
      var stored = localStorage.getItem('site-theme')
      var dark = stored ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', dark ? '#12100e' : '#f4efe6')
    } catch (e) {}
  </script>

  <script>
    // Consent bootstrap: the banner is part of the first paint, not something
    // that appears once React has hydrated. Mounting it late made a cookie
    // notice the largest element on the page four seconds in, which is the
    // worst possible LCP; and a reader who had already chosen saw it flash.
    // This decides before paint whether the banner belongs on the page at all.
    // Key and version are shared with src/consent.js - keep them in sync.
    try {
      var choice = JSON.parse(localStorage.getItem('cb-consent') || 'null')
      var settled = !!(choice && choice.v === 1)
      var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack
      var signal = navigator.globalPrivacyControl === true || dnt === '1' || dnt === 'yes'
      document.documentElement.dataset.consent = settled || signal ? 'settled' : 'pending'
    } catch (e) {
      document.documentElement.dataset.consent = 'pending'
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
